# yolov8m-featenhancer-pre.yaml

# Parameters
nc: 1
depth_multiple: 0.67
width_multiple: 0.75

# Backbone
backbone:
  # [from, number, module, args]

  # FeatEnHancer is the first layer, taking a 3-channel image. No arguments needed.
  - [-1, 1, FeatEnHancer, []]  # 0

  # First Conv layer accepts 24 channels from FeatEnHancer
  - [-1, 1, Conv, [48, 3, 2]]  # 1-P1/2
  - [-1, 1, Conv, [96, 3, 2]]  # 2-P2/4
  - [-1, 2, C2f, [96, True]]   # 3
  - [-1, 1, Conv, [192, 3, 2]] # 4-P3/8
  - [-1, 4, C2f, [192, True]]  # 5
  - [-1, 1, Conv, [384, 3, 2]] # 6-P4/16
  - [-1, 4, C2f, [384, True]]  # 7
  - [-1, 1, Conv, [576, 3, 2]] # 8-P5/32
  - [-1, 2, C2f, [576, True]]  # 9
  - [-1, 1, SPPF, [576, 5]]     # 10

# Head 
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 7], 1, Concat, [1]]  # 12 cat backbone P4
  - [-1, 2, C2f, [576]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 5], 1, Concat, [1]]  # 15 cat backbone P3
  - [-1, 2, C2f, [384]]  # 16

  - [-1, 1, Conv, [384, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 2, C2f, [576]]  # 19

  - [-1, 1, Conv, [576, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 2, C2f, [576]]  # 22

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)